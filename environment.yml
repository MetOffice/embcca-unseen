# Environment for the manuscript analyses in paper/.
#
# The embcca-unseen package itself needs only NumPy and installs with pip on
# any platform; everything here is for the analyses and their comparison
# methods. After creating this environment, run `pip install -e .` to add the
# package itself.
name: embcca-unseen
channels:
  - conda-forge
dependencies:
  - python=3.12.10
  - numpy=2.5.3
  - scipy=1.18.0
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - scikit-learn=1.9.0
  - netcdf4=1.7.4
  - cftime=1.6.5
  - pandas=3.0.5
  - cartopy=0.25.0
  - shapely=2.1.2
  - pyproj=3.7.2
  - geos=3.14.1
  - proj=9.7.1
  - scitools-iris=3.16.0
  # eigen and pybind11 are build-time requirements for SBCK, which has no
  # Linux or Windows wheel and is compiled from source during the pip step.
  - eigen=5.0.1
  - pybind11=3.1.0
  - pip
  - pip:
      - SBCK==1.4.2
